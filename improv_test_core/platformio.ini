; Изолирующий тест Improv-WiFi через новую idryer-core (фасад iDryer::Link).
; Структурно идентичен improv_test/, но использует idryer-core через symlink в lib/.
; Цель: понять — виновата сама idryer-core или Storage/main.cpp вокруг неё.

[platformio]
default_envs = esp32c3-super-mini-improv-core

[env:esp32c3-super-mini-improv-core]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = /dev/cu.usbmodem11401
monitor_port = /dev/cu.usbmodem11401
monitor_speed = 115200
monitor_raw = yes

lib_deps =
  bblanchon/ArduinoJson @ ^6.21.3
  knolleary/PubSubClient @ ^2.8
  densaugeo/base64 @ ^1.4.0
  https://github.com/jnthas/Improv-WiFi-Library.git
  links2004/WebSockets @ ^2.4.0

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DIDRYER_API_BASE=\"https://portal.idryer.org/api\"
  -DMQTT_BROKER=\"mqtt.idryer.org\"
  -DMQTT_PORT=8883
  -DMQTT_USE_TLS=1
