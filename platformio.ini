; Menu generation:       extra_scripts/pre_gen_menu.py + lib/idryer-core/menu/menu_gen.py
; [env] +  [flags_*] + [env:*]
; extra_scripts в [env:*] перезапписывает [env],
; а не дополняет, поэтому pre + post
; нужно указывать явно в каждом env.

[platformio]
default_envs = esp32c3-devkitm-prod, esp32c3-super-mini-prod, xiao-esp32s3-prod, waveshare-esp32s3-zero-prod

; =============================================================================
; Base settings — shared by all envs
; =============================================================================
[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = /dev/cu.usbmodem112401
monitor_port = /dev/cu.usbmodem112401
monitor_speed = 115200
monitor_raw = yes

; Общие зависимости (MQTT, ArduinoJson, WebSockets, Improv-форк) приходят
; транзитивно из lib/idryer-core → library.json → dependencies.
lib_deps =
  densaugeo/base64 @ ^1.4.0
  fastled/FastLED @ ^3.6.0
  robtillaart/SHT31 @ ^0.5.0
; ESPAsyncTCP — ESP8266-транспорт из манифеста espMqttClient; как транзитивная
; зависимость 2-го уровня ставится без учёта platforms-фильтра и ломает сборку.
lib_ignore = ESPAsyncTCP

[flags_prod]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DIDRYER_API_BASE=\"https://portal.idryer.org/api\"
  -DMQTT_BROKER=\"mqtt.idryer.org\"
  -DMQTT_PORT=8883
  -DMQTT_USE_TLS=1

; Staging cloud endpoints, no TLS
[flags_stage]
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DIDRYER_API_BASE=\"https://staging.idryer.org/api\"
  -DMQTT_BROKER=\"staging.idryer.org\"
  -DMQTT_PORT=1884
  -DMQTT_USE_TLS=0

[flags_local]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DIDRYER_API_BASE=\"http://192.168.1.27:3000\"
  -DMQTT_BROKER=\"192.168.1.27\"
  -DMQTT_PORT=1883
  -DMQTT_USE_TLS=0

; USB CDC flags for ESP32-C3 (native USB CDC)
[flags_c3_usb]
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEBUG_SERIAL=Serial
  -Iinclude
  -Isrc/menu       ; auto-generated menu headers (см. extra_scripts/pre_gen_menu.py)
  ; espMqttClient: входящие команды/OTA-чанки до 16КБ одним куском.
  -DEMC_RX_BUFFER_SIZE=16384

; USB CDC flags for ESP32-S3 (native USB CDC, same as C3)
[flags_s3_usb]
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEBUG_SERIAL=Serial
  -Iinclude
  -Isrc/menu       ; auto-generated menu headers (см. extra_scripts/pre_gen_menu.py)
  ; espMqttClient: входящие команды/OTA-чанки до 16КБ одним куском.
  -DEMC_RX_BUFFER_SIZE=16384

; Wi-Fi TX-мощность для плат со слабым регулятором питания (ESP32-C3 Super Mini):
; дефолтные 19.5 dBm вызывают просадку питания и обрывы Wi-Fi, поэтому режем до 8.5 dBm.
; Платы с нормальной антенной/питанием (devkit, XIAO S3) флаг не подключают → дефолт SDK.
; typedef enum {
;     WIFI_POWER_19_5dBm = 78,// 19.5dBm
;     WIFI_POWER_19dBm = 76,// 19dBm
;     WIFI_POWER_18_5dBm = 74,// 18.5dBm
;     WIFI_POWER_17dBm = 68,// 17dBm
;     WIFI_POWER_15dBm = 60,// 15dBm
;     WIFI_POWER_13dBm = 52,// 13dBm
;     WIFI_POWER_11dBm = 44,// 11dBm
;     WIFI_POWER_8_5dBm = 34,// 8.5dBm
;     WIFI_POWER_7dBm = 28,// 7dBm
;     WIFI_POWER_5dBm = 20,// 5dBm
;     WIFI_POWER_2dBm = 8,// 2dBm
;     WIFI_POWER_MINUS_1dBm = -4// -1dBm
; } wifi_power_t;
[flags_wifi_supermini]
build_flags =
  -DIDRYER_WIFI_TX_POWER=WIFI_POWER_8_5dBm

[env:esp32c3-devkitm-prod]
board = esp32-c3-devkitm-1
; upload_port = /dev/cu.usbmodem101
; monitor_port = /dev/cu.usbmodem101
extra_scripts =
  pre:extra_scripts/pre_gen_menu.py
  post:extra_scripts/post_build.py
build_flags =
  ${flags_c3_usb.build_flags}
  ${flags_prod.build_flags}
  -DSTORAGE_LED_PIN=4
  -DSTORAGE_MAX_LEDS=300
  -DSTORAGE_I2C_SDA=8
  -DSTORAGE_I2C_SCL=9

