; PlatformIO Project Configuration File
; Active product: Storage Link
; Library: lib/idryer-core
; Reference/migration code: reference/

[platformio]
default_envs = esp32c3-storage-prod, esp32c3-super-mini-prod, xiao-esp32s3-prod, waveshare-esp32s3-zero-prod

; =============================================================================
; Base settings — shared by all envs
; =============================================================================
[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200
monitor_raw = yes
lib_ignore = idryer-protocol

; Источники продукта: main.cpp, продуктовые модули src/storage/, и
; автогенерация меню в src/menu/ (заполняется pre_gen_menu.py).
build_src_filter = +<main.cpp> +<storage/**> +<menu/**>

; -Isrc/menu для разрешения `#include <menu_state.h>` положен ниже,
; в [flags_c3_usb] / [flags_s3_usb], потому что env-specific build_flags
; переопределяют базовый [env].build_flags (PIO не дополняет).

; ВНИМАНИЕ: extra_scripts в env-специфичных секциях ПЕРЕЗАПИСЫВАЕТ базовый,
; не дополняет. Поэтому каждый [env:*] явно перечисляет ОБА хука:
;   pre:pre_gen_menu.py  — автогенерация меню перед компиляцией
;   post:copy_firmware.py / stage_auto_claim.py — пост-сборка (env-specific)
; Базовый extra_scripts тут не указываем, чтобы не путать.

lib_deps =
  bblanchon/ArduinoJson @ ^6.21.3
  knolleary/PubSubClient @ ^2.8
  densaugeo/base64 @ ^1.4.0
  https://github.com/jnthas/Improv-WiFi-Library.git
  links2004/WebSockets @ ^2.4.0
  fastled/FastLED @ ^3.6.0
  robtillaart/SHT31 @ ^0.5.0

; =============================================================================
; Shared flag groups
; =============================================================================

; Production cloud endpoints, TLS on
[flags_prod]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DIDRYER_API_BASE=\"https://portal.idryer.org/api\"
  -DMQTT_BROKER=\"mqtt.idryer.org\"
  -DMQTT_PORT=8883
  -DMQTT_USE_TLS=1

; Staging cloud endpoints, no TLS
[flags_stage]
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DIDRYER_API_BASE=\"https://staging.idryer.org/api\"
  -DMQTT_BROKER=\"staging.idryer.org\"
  -DMQTT_PORT=1884
  -DMQTT_USE_TLS=0

; USB CDC flags for ESP32-C3 (native USB CDC)
[flags_c3_usb]
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEBUG_SERIAL=Serial
  -Iinclude
  -Isrc/menu       ; auto-generated menu headers (см. extra_scripts/pre_gen_menu.py)

; USB CDC flags for ESP32-S3 (native USB CDC, same as C3)
[flags_s3_usb]
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEBUG_SERIAL=Serial
  -Iinclude
  -Isrc/menu       ; auto-generated menu headers (см. extra_scripts/pre_gen_menu.py)

; =============================================================================
; ESP32-C3 DevKitM-1 — Storage Link (production)
; Pins: LED=4, I2C SDA=8 SCL=9
; =============================================================================
[env:esp32c3-storage-prod]
board = esp32-c3-devkitm-1
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
extra_scripts =
  pre:extra_scripts/pre_gen_menu.py
  post:extra_scripts/copy_firmware.py
build_flags =
  ${flags_c3_usb.build_flags}
  ${flags_prod.build_flags}
  -DSTORAGE_LED_PIN=4
  -DSTORAGE_MAX_LEDS=300
  -DSTORAGE_I2C_SDA=8
  -DSTORAGE_I2C_SCL=9

; =============================================================================
