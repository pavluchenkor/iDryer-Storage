; =============================================================================
; ESP32-C3 Super Mini — Storage Link (DEV: PROD endpoints + Serial REPL)
; Включает in-firmware REPL: wifi/claim/wipe/status/restart/help.
; =============================================================================
[env:esp32c3-super-mini-dev]
board = esp32-c3-devkitm-1
upload_port = /dev/cu.usbmodem11101
monitor_port = /dev/cu.usbmodem11101
extra_scripts =
  pre:extra_scripts/pre_gen_menu.py
  post:extra_scripts/post_build.py
build_flags =
  ${flags_c3_usb.build_flags}
  ${flags_prod.build_flags}
  -DSTORAGE_LED_PIN=4
  -DSTORAGE_MAX_LEDS=300
  -DSTORAGE_I2C_SDA=8
  -DSTORAGE_I2C_SCL=9
  -DCORE_DEBUG_LEVEL=3       ; override prod=0 для dev-логов
  -DIDRYER_DEV_REPL=1
